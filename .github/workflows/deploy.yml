name: Deploy Vae kernel to GitHub Pages

on:
  pull_request:
    types: [closed]
    branches: [ "brighter-than-every-star" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            nasm \
            grub-common \
            grub-pc-bin \
            xorriso \
            dosfstools \
            mtools

      - name: Configure CMake and Build Kernel & ISO
        run: |
          cmake -B build -DBUILDISO=ON -DBUILDIMG=ON -DBUILDBIN=ON
          cmake --build build

      - name: Create kernel folder and move builded files
        run: |
          scripts/update_web_kernel.sh

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4