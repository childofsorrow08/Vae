<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>oscore</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: sans-serif;
            color: #fff;
        }
        #menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        #menu select, #menu button {
            padding: 10px 20px;
            font-size: 16px;
            margin-top: 15px;
            cursor: pointer;
        }
        #screen_container {
            width: 100vw;
            height: 100vh;
            display: none;
            justify-content: center;
            align-items: center;
            background: #000;
        }
        #screen_container > div {
            width: 100% !important;
            height: 100% !important;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #screen_container canvas {
            max-width: 100% !important;
            max-height: 100% !important;
            width: auto !important;
            height: auto !important;
            object-fit: contain !important;
        }
    </style>
</head>
<body>
    <div id="menu">
        <h1>Select Boot Source</h1>
        <select id="boot_source">
            <option value="iso">1) ISO</option>
            <option value="efi">2) EFI</option>
            <option value="img">3) IMG</option>
            <option value="bin">4) BIN</option>
        </select>
        <button id="start_btn">Start</button>
    </div>

    <div id="screen_container">
        <div></div>
    </div>

    <script src="v86/libv86.js"></script>
    <script>
    "use strict";

    document.getElementById("start_btn").onclick = function() {
        var choice = document.getElementById("boot_source").value;

        document.getElementById("menu").style.display = "none";
        document.getElementById("screen_container").style.display = "flex";

        var config = {
            wasm_path: "v86/v86.wasm",
            memory_size: 128 * 1024 * 1024,
            vga_memory_size: 8 * 1024 * 1024,
            screen_container: document.getElementById("screen_container").querySelector("div"),
            bios: {
                url: "bios/seabios.bin",
            },
            vga_bios: {
                url: "bios/vgabios.bin",
            },
            autostart: true,
        };

        switch (choice) {
            case "iso":
                config.cdrom = { url: "kernel/kernel.iso" };
                config.boot_order = 0x123;
                break;
            case "efi":
                config.hda = { url: "kernel/kernel.efi" };
                break;
            case "img":
                config.hda = { url: "kernel/kernel.img" };
                config.boot_order = 0x213;
                break;
            case "bin":
                config.fda = { url: "kernel/kernel.bin" };
                config.boot_order = 0x132;
                break;
        }

        var emulator = new V86(config);
    };
    </script>
</body>
</html>
